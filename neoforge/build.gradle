plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.140'
}

version = mod_version
group = mod_group_id

base { archivesName = "${mod_id}-neoforge" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
}

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        autotest {
            client()
            systemProperty 'calibre.autotest', 'true'
            systemProperty 'calibre.autotest.guns', (project.findProperty('autotestGuns') ?: '')
            systemProperty 'calibre.autotest.film', (project.findProperty('autotestFilm') ?: 'false')
            programArguments.addAll '--width', '1280', '--height', '720', '--username', 'Tester'
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath(), '--existing', file('../common/src/main/resources/').getAbsolutePath()
        }
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

// loader-neutral code and every generated asset live in ../common and are compiled into this jar
sourceSets.main.java { srcDir '../common/src/main/java' }
sourceSets.main.resources { srcDir '../common/src/main/resources'; srcDir 'src/generated/resources' }

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    // Bundle GeckoLib inside calibre.jar (NeoForge jar-in-jar): players only need this one file.
    // If a newer GeckoLib is installed separately, NeoForge picks the newest compatible version.
    jarJar("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}") {
        version {
            strictly "[${geckolib_version},6.0)"
            prefer geckolib_version
        }
    }
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version, neo_version_range: neo_version_range,
            loader_version_range   : loader_version_range, mod_id: mod_id, mod_name: mod_name,
            mod_license            : mod_license, mod_version: mod_version, mod_authors: mod_authors,
            mod_description        : mod_description, geckolib_version: geckolib_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// license + credits ship inside the jar
tasks.named("jar") {
    from(rootProject.file("LICENSE"))
    from(rootProject.file("CREDITS.md"))
}
