plugins {
    id 'fabric-loom' version "${loom_version}"
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-fabric" }

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content { includeGroup 'software.bernie.geckolib' }
    }
    maven { name = 'ParchmentMC'; url = 'https://maven.parchmentmc.org' }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
}

// loader-neutral code and every generated asset live in ../common and are compiled into this jar
sourceSets.main.java { srcDir '../common/src/main/java' }
sourceSets.main.resources { srcDir '../common/src/main/resources' }

loom {
    accessWidenerPath = file('src/main/resources/calibre.accesswidener')
    runs {
        client {
            client()
            vmArg '-Dfabric-api.gametest.command=true'
        }
        server {
            server()
        }
        autotest {
            client()
            name = 'Calibre Autotest'
            vmArg '-Dcalibre.autotest=true'
            vmArg "-Dcalibre.autotest.guns=${project.findProperty('autotestGuns') ?: ''}"
            vmArg "-Dcalibre.autotest.film=${project.findProperty('autotestFilm') ?: 'false'}"
            programArgs '--width', '1280', '--height', '720', '--username', 'Tester'
            runDir 'run'
        }
        gametest {
            server()
            name = 'Calibre GameTests'
            vmArg '-Dfabric-api.gametest'
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get()}/gametest.xml"
            runDir 'build/gametest'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft_version}:${parchment_mappings_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    // GeckoLib is bundled inside the jar (Fabric jar-in-jar), so players only need Calibre + Fabric API
    modImplementation "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"
    include "software.bernie.geckolib:geckolib-fabric-${minecraft_version}:${geckolib_version}"

    // optional: in-game settings screen through Mod Menu
    modCompileOnly "com.terraformersmc:modmenu:${modmenu_version}"
}

processResources {
    var props = [version: mod_version, minecraft_version: minecraft_version, geckolib_version: geckolib_version,
                 fabric_loader_version: fabric_loader_version, mod_name: mod_name, mod_description: mod_description,
                 mod_license: mod_license]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

// license + credits ship inside the jar
tasks.named("jar") {
    from(rootProject.file("LICENSE"))
    from(rootProject.file("CREDITS.md"))
}
